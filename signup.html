<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 | BODY1ST</title>
<style>
  :root {
    --bg: #faf7f8;
    --bg-alt: #ffffff;
    --ink: #201317;
    --ink-soft: #6e5b62;
    --accent: #9c1f4a;
    --accent-soft: #f6e3ea;
    --accent-deep: #6f1636;
    --line: #ecdfe4;
    --radius: 18px;
    --shadow: 0 10px 30px rgba(32, 19, 23, 0.08);
    --danger: #c0392b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #fff 0%, var(--accent-soft) 100%);
    color: var(--ink);
    line-height: 1.6;
    padding: 24px;
  }

  a { color: inherit; }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--bg-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px 32px;
  }

  .brand {
    text-align: center;
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--accent-deep);
    margin-bottom: 6px;
  }

  h1 {
    text-align: center;
    font-size: 1.3rem;
    margin: 0 0 28px;
    letter-spacing: -0.02em;
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--ink-soft);
  }

  .field { margin-bottom: 18px; }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    font-size: 0.95rem;
    background: var(--bg);
    color: var(--ink);
    font-family: inherit;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .hint {
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 999px;
    font-size: 0.98rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 8px 20px rgba(156, 31, 74, 0.35);
    transition: background 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
    margin-top: 8px;
  }

  .btn:hover { background: var(--accent-deep); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    display: none;
  }

  .msg.show { display: block; }
  .msg.error { background: #fdecea; color: var(--danger); }
  .msg.success { background: #e9f7ef; color: #1e7d43; }

  .switch {
    text-align: center;
    margin-top: 22px;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .switch a {
    color: var(--accent-deep);
    font-weight: 700;
    text-decoration: none;
  }

  .switch a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="brand">BODY1ST</div>
  <h1>회원가입</h1>

  <form id="signupForm">
    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="6자 이상 입력해주세요" required minlength="6" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="passwordConfirm">비밀번호 확인</label>
      <input type="password" id="passwordConfirm" placeholder="비밀번호를 다시 입력해주세요" required minlength="6" autocomplete="new-password">
      <div class="hint">가입 완료 후 인증 메일이 발송돼요. 메일함에서 확인 링크를 눌러야 로그인할 수 있어요.</div>
    </div>

    <button type="submit" class="btn" id="submitBtn">회원가입</button>

    <div class="msg" id="msgBox"></div>
  </form>

  <div class="switch">
    이미 계정이 있으신가요? <a href="login.html">로그인</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nqxncpwwcgyaanrehibs.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xeG5jcHd3Y2d5YWFucmVoaWJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwOTYyNjEsImV4cCI6MjEwMTY3MjI2MX0.Xczq_wIwH5seetFo0LdbPLFXo5zUlII2Ij3Hej8p91E";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("signupForm");
  const submitBtn = document.getElementById("submitBtn");
  const msgBox = document.getElementById("msgBox");

  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className = "msg show " + type;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const passwordConfirm = document.getElementById("passwordConfirm").value;

    if (password !== passwordConfirm) {
      showMsg("비밀번호가 일치하지 않아요.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "가입 처리 중...";

    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: new URL("login.html", window.location.href).href
      }
    });

    submitBtn.disabled = false;
    submitBtn.textContent = "회원가입";

    if (error) {
      showMsg(error.message, "error");
      return;
    }

    showMsg("가입 신청이 완료됐어요. 입력하신 이메일로 발송된 인증 메일의 링크를 눌러 인증을 완료해주세요.", "success");
    form.reset();
  });
</script>

</body>
</html>
